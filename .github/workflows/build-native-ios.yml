name: Build Native iOS (SwiftUI — iOS 18+)

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
      - main
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Swift Test + Build
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          swift --version
          xcodebuild -version

      - name: Run Unit Tests
        working-directory: ios
        run: swift test --verbose 2>&1 | tee test-results.txt

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: ios/test-results.txt
          retention-days: 14

  deploy-testflight:
    name: Deploy to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use latest available Xcode so its SDK matches a pre-installed
          # simulator runtime (actool requires a matching runtime even for
          # device-only archives). Runner has iOS 18.5/18.6/26.x runtimes.
          LATEST=$(ls /Applications | grep "^Xcode_" | sort -V | tail -1)
          sudo xcode-select -s "/Applications/$LATEST"
          xcodebuild -version

      - name: Set up App Store Connect API key
        env:
          ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Import Distribution Certificate
        env:
          DISTRIBUTION_CERTIFICATE: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p "" build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          echo "$DISTRIBUTION_CERTIFICATE" | base64 --decode > distribution.p12
          security import distribution.p12 -k build.keychain \
            -P "$DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          # Add to search list so xcodebuild finds the cert (critical step)
          security list-keychains -d user -s build.keychain login.keychain
          security find-identity -v -p codesigning build.keychain
          rm distribution.p12

      - name: Install Provisioning Profiles
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          PROVISIONING_PROFILE_WIDGET: ${{ secrets.PROVISIONING_PROFILE_WIDGET }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          install_profile() {
            echo "$1" | base64 --decode > /tmp/prof.mobileprovision
            UUID=$(security cms -D -i /tmp/prof.mobileprovision | plutil -extract UUID raw -)
            NAME=$(security cms -D -i /tmp/prof.mobileprovision | plutil -extract Name raw -)
            cp /tmp/prof.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
            echo "Installed: $NAME ($UUID)"
            rm /tmp/prof.mobileprovision
          }
          install_profile "$PROVISIONING_PROFILE"
          install_profile "$PROVISIONING_PROFILE_WIDGET"

      - name: Bump build number
        working-directory: ios
        run: |
          agvtool new-version -all ${{ github.run_number }}

      - name: Archive
        working-directory: ios
        run: |
          xcodebuild \
            -scheme ArenaProtocol \
            -sdk iphoneos \
            -configuration Release \
            archive \
            -archivePath ArenaProtocol.xcarchive \
            ENABLE_ON_DEMAND_RESOURCES=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

      - name: Export and Upload to TestFlight
        working-directory: ios
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath ArenaProtocol.xcarchive \
            -exportPath ArenaProtocol-export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ArenaProtocol-${{ github.run_number }}-${{ github.sha }}
          path: ios/ArenaProtocol.xcarchive
          retention-days: 30
          if-no-files-found: warn
