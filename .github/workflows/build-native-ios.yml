name: Build Native iOS (SwiftUI — iOS 18+)

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
      - main
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Swift Test + Build
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          swift --version
          xcodebuild -version

      - name: Run Unit Tests
        working-directory: ios
        run: swift test --verbose 2>&1 | tee test-results.txt

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: ios/test-results.txt
          retention-days: 14

  deploy-testflight:
    name: Deploy to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app

      - name: Set up App Store Connect API key
        env:
          ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Bump build number
        working-directory: ios
        run: |
          agvtool new-version -all ${{ github.run_number }}

      - name: Archive
        working-directory: ios
        run: |
          xcodebuild \
            -scheme ArenaProtocol \
            -destination "generic/platform=iOS" \
            -configuration Release \
            archive \
            -archivePath ArenaProtocol.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

      - name: Export and Upload to TestFlight
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath ArenaProtocol.xcarchive \
            -exportPath ArenaProtocol-export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }} \
          | xcpretty

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ArenaProtocol-${{ github.run_number }}-${{ github.sha }}
          path: ios/ArenaProtocol.xcarchive
          retention-days: 30
          if-no-files-found: warn
